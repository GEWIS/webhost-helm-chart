{{- $clientId := required "oidc.provider.clientId is required" .Values.oidc.provider.clientId -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "static-webhost.fullname" . }}-openbao
  labels:
    {{- include "static-webhost.labels" . | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "static-webhost.fullname" . }}-keycloak
  labels:
    {{- include "static-webhost.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.oidc.openbao.server | quote }}
      path: {{ .Values.oidc.openbao.mount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: keycloak-{{ .Release.Namespace }}
          serviceAccountRef:
            name: {{ include "static-webhost.fullname" . }}-openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oidc-secret
  labels:
    {{- include "static-webhost.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "static-webhost.fullname" . }}-keycloak
    kind: SecretStore
  target:
    name: oidc-secret
  data:
    - secretKey: providerClientSecret
      remoteRef:
        key: {{ .Release.Namespace }}/{{ $clientId }}
        property: providerClientSecret
    - secretKey: pluginSecret
      remoteRef:
        key: {{ .Release.Namespace }}/{{ $clientId }}
        property: pluginSecret
